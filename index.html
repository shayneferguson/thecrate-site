<article class="hero record-stage" data-grooves="running" aria-label="The Crate — Institute for Creative Thought">

    <li class="cue" style="--delay:0s">DESIGN</li>
    <li class="cue" style="--delay:.1s">SOUND</li>
    <li class="cue" style="--delay:.2s">IMAGE</li>
    <li class="cue" style="--delay:.3s">IDEAS</li>
    <li class="cue" style="--delay:.4s">IN CIRCULATION</li>

  <button class="record-touch" type="button" aria-label="Start Out the Crate" aria-describedby="sound-instructions" aria-pressed="false" hidden></button>

      <button class="label-control" type="button" aria-label="Start Out the Crate" aria-pressed="false" hidden><span class="sound-hint" id="sound-instructions">Touch the record to play.</span></button>
      <p class="sound-credit">OUT THE CRATE / 74 BPM</p>
      <audio id="soundtrack" controls preload="none" aria-label="Out the Crate, 74 BPM, 3 minutes 29 seconds" src="assets/out-the-crate.mp3?v=balanced-2"></audio>
      <p class="sound-status" role="status"></p>
    </section>
  </footer>
